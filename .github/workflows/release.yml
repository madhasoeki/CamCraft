name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build and publish (e.g. v0.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata & Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate SemVer & prepare tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected SemVer format like v0.0.1 or v0.1.0-rc.1"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          PRE="${BASH_REMATCH[4]}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}${PRE}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          IS_PRE="false"
          if [ -n "$PRE" ] || [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRE="true"
          fi

          IS_DRAFT="false"
          if [ "$INPUT_DRAFT" = "true" ]; then
            IS_DRAFT="true"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "refs/tags/${TAG}"
            fi
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "prerelease=${IS_PRE}"
            echo "draft=${IS_DRAFT}"
          } >> "$GITHUB_OUTPUT"

  build-desktop-fedora:
    name: Build Desktop (Fedora x86_64 RPM & Tarball)
    runs-on: ubuntu-latest
    needs: [prepare, build-desktop-linux]
    container: fedora:latest
    steps:
      - name: Install Fedora RPM build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            tar \
            gzip \
            findutils \
            rpm-build \
            pipewire-utils
          dnf clean all

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download portable desktop binaries and private FFmpeg libs
        uses: actions/download-artifact@v8
        with:
          name: desktop-bundle
          path: dist/bundle

      - name: Package Fedora desktop archive
        run: |
          chmod 0755 dist/bundle/bin/camcraft-gui dist/bundle/bin/camcraft-cli dist/bundle/privlib/lib*.so*
          PKG_DIR="dist/camcraft-desktop-fedora-x86_64"
          mkdir -p "$PKG_DIR/lib/camcraft"
          cp dist/bundle/bin/camcraft-gui "$PKG_DIR/"
          cp dist/bundle/bin/camcraft-cli "$PKG_DIR/"
          cp -a dist/bundle/privlib/lib*.so* "$PKG_DIR/lib/camcraft/"
          cp scripts/setup-fedora-dev.sh "$PKG_DIR/"
          cp packaging/linux/70-camcraft-aoa.rules "$PKG_DIR/"
          cp assets/branding/linux/org.artcraft.camcraft.desktop "$PKG_DIR/"
          cp assets/branding/svg/camcraft-symbol-app-icon.svg "$PKG_DIR/org.artcraft.camcraft.svg"
          cp assets/branding/png/camcraft-app-icon-256.png "$PKG_DIR/org.artcraft.camcraft.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"
          chmod +x "$PKG_DIR/camcraft-gui" "$PKG_DIR/camcraft-cli" "$PKG_DIR/setup-fedora-dev.sh"
          tar -C dist -czf "dist/camcraft-desktop-fedora-x86_64.tar.gz" "camcraft-desktop-fedora-x86_64"

      - name: Package Fedora RPM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RPM_TOPDIR="${PWD}/dist/rpmbuild"
          mkdir -p "${RPM_TOPDIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb packaging/linux/camcraft.spec \
            --define "_topdir ${RPM_TOPDIR}" \
            --define "_sourcedir ${PWD}" \
            --define "_version ${VERSION}" \
            --define "_bindir ${PWD}/dist/bundle/bin" \
            --define "_privlibdir ${PWD}/dist/bundle/privlib"
          find "${RPM_TOPDIR}/RPMS" -name "*.rpm" -exec cp -v {} dist/ \;

      - name: Verify RPM dependencies and install smoke test
        run: |
          RPM_FILE="$(ls dist/camcraft-*.rpm | head -n 1)"
          echo "=== RPM Requires ==="
          rpm -qpR "$RPM_FILE"
          echo "=== RPM Provides ==="
          rpm -qp --provides "$RPM_FILE"
          if rpm -qpR "$RPM_FILE" | grep -qE '^lib(avcodec|avutil|swscale|avformat)\.so'; then
            echo "::error::RPM unexpectedly requires system FFmpeg SONAMEs!"
            exit 1
          fi
          if rpm -qp --provides "$RPM_FILE" | grep -qE '^lib(avcodec|avutil|swscale|avformat)\.so'; then
            echo "::error::RPM unexpectedly provides private FFmpeg SONAMEs!"
            exit 1
          fi
          dnf install -y "$RPM_FILE"
          /usr/bin/camcraft-cli status

      - name: Upload Fedora desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-fedora
          path: |
            dist/camcraft-desktop-fedora-x86_64.tar.gz
            dist/*.rpm
          if-no-files-found: error

  build-desktop-linux:
    name: Build Desktop (Ubuntu 22.04 AppImage, DEB & Tarball)
    runs-on: ubuntu-latest
    needs: prepare
    container: ubuntu:22.04
    steps:
      - name: Install Ubuntu 22.04 multimedia, packaging, and desktop build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            tar \
            gzip \
            xz-utils \
            findutils \
            curl \
            ca-certificates \
            file \
            dpkg-dev \
            desktop-file-utils \
            build-essential \
            nasm \
            patchelf \
            pkg-config \
            clang \
            libclang-dev \
            libasound2-dev \
            libpulse-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev
          rm -rf /var/lib/apt/lists/*

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build minimal LGPL FFmpeg 7.1.3 shared libraries
        run: |
          chmod +x packaging/linux/build-minimal-ffmpeg.sh
          ./packaging/linux/build-minimal-ffmpeg.sh /tmp/camcraft-ffmpeg /tmp/camcraft-privlib

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Build release binaries
        working-directory: desktop
        env:
          PKG_CONFIG_PATH: /tmp/camcraft-ffmpeg/lib/pkgconfig
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN/../lib/camcraft:$ORIGIN/lib/camcraft"
        run: |
          cargo build --release --locked -p camcraft-gui -p camcraft-cli
          for bin in target/release/camcraft-gui target/release/camcraft-cli; do
            echo "=== readelf -d ${bin} ==="
            readelf -d "${bin}" | grep -E 'NEEDED|RPATH|RUNPATH'
          done

      - name: Package generic Linux desktop archive and smoke-test $ORIGIN RPATH
        run: |
          PKG_DIR="dist/camcraft-desktop-linux-x86_64"
          mkdir -p "$PKG_DIR/lib/camcraft"
          cp desktop/target/release/camcraft-gui "$PKG_DIR/"
          cp desktop/target/release/camcraft-cli "$PKG_DIR/"
          cp -a /tmp/camcraft-privlib/lib*.so* "$PKG_DIR/lib/camcraft/"
          cp packaging/linux/70-camcraft-aoa.rules "$PKG_DIR/"
          cp assets/branding/linux/org.artcraft.camcraft.desktop "$PKG_DIR/"
          cp assets/branding/svg/camcraft-symbol-app-icon.svg "$PKG_DIR/org.artcraft.camcraft.svg"
          cp assets/branding/png/camcraft-app-icon-256.png "$PKG_DIR/org.artcraft.camcraft.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"
          chmod +x "$PKG_DIR/camcraft-gui" "$PKG_DIR/camcraft-cli"
          env -u LD_LIBRARY_PATH "$PKG_DIR/camcraft-cli" status
          tar -C dist -czf "dist/camcraft-desktop-linux-x86_64.tar.gz" "camcraft-desktop-linux-x86_64"

      - name: Package Debian/Ubuntu .deb
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "$VERSION" desktop/target/release dist /tmp/camcraft-privlib
          dpkg-deb -I dist/*.deb

      - name: Install appimagetool and package AppImage
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh "$TAG" desktop/target/release dist /tmp/camcraft-privlib

      - name: Stage portable desktop bundle for RPM packaging
        run: |
          mkdir -p dist/bundle/bin dist/bundle/privlib
          cp desktop/target/release/camcraft-gui dist/bundle/bin/
          cp desktop/target/release/camcraft-cli dist/bundle/bin/
          cp -a /tmp/camcraft-privlib/lib*.so* dist/bundle/privlib/

      - name: Upload generic Linux desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            dist/camcraft-desktop-linux-x86_64.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

      - name: Upload portable desktop bundle for Fedora RPM job
        uses: actions/upload-artifact@v7
        with:
          name: desktop-bundle
          path: dist/bundle
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      signing_mode: ${{ steps.signing.outputs.signing_mode }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Configure Android signing credentials
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PcamcraftVersionName=${{ needs.prepare.outputs.version }}
          -PcamcraftVersionCode=${{ needs.prepare.outputs.version_code }}
          -PcamcraftGithubRepo=${{ github.repository }}

      - name: Stage versioned APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/camcraft-android-${{ needs.prepare.outputs.tag }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/camcraft-android-*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-desktop-fedora, build-desktop-linux, build-android]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download Fedora release artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-fedora
          path: release-assets

      - name: Download generic Linux release artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: release-assets

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          shopt -s nullglob
          ASSETS=(
            CamCraft-*.AppImage
            camcraft-*.rpm
            camcraft_*.deb
            camcraft-desktop-fedora-x86_64.tar.gz
            camcraft-desktop-linux-x86_64.tar.gz
            camcraft-android-*.apk
          )
          if [ "${#ASSETS[@]}" -lt 6 ]; then
            echo "::error::Expected AppImage, RPM, DEB, Fedora tarball, Linux tarball, and APK; found: ${ASSETS[*]}"
            ls -la
            exit 1
          fi
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          SIGNING_MODE: ${{ needs.build-android.outputs.signing_mode }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 - "$VERSION" "$NOTES_FILE" <<'PY'
          import pathlib, re, sys

          version, out_path = sys.argv[1], sys.argv[2]
          changelog = pathlib.Path("CHANGELOG.md")
          extracted = ""
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if m:
                  extracted = m.group(1).strip()

          pathlib.Path(out_path).write_text(extracted, encoding="utf-8")
          PY

          APPIMAGE_FILE=$(basename release-assets/CamCraft-*.AppImage)
          RPM_FILE=$(basename release-assets/camcraft-*.rpm)
          DEB_FILE=$(basename release-assets/camcraft_*.deb)
          APK_FILE=$(basename release-assets/camcraft-android-*.apk)

          {
            if [ -s "$NOTES_FILE" ]; then
              echo ""
            fi
            echo "## Downloads & Quick Install"
            echo ""
            echo "| Platform | Package | Quick Start |"
            echo "| --- | --- | --- |"
            echo "| **Any Linux (Universal)** | \`${APPIMAGE_FILE}\` | \`chmod +x ${APPIMAGE_FILE} && ./${APPIMAGE_FILE}\` |"
            echo "| **Fedora / RHEL (x86_64)** | \`${RPM_FILE}\` | \`sudo dnf install -y ./${RPM_FILE}\` |"
            echo "| **Debian / Ubuntu (amd64)** | \`${DEB_FILE}\` | \`sudo apt install -y ./${DEB_FILE}\` |"
            echo "| **Android (Universal APK)** | \`${APK_FILE}\` | Install on Android 10+ (API 29+) |"
            echo ""
            echo "### Portable Tarballs & Checksums"
            echo "- **Fedora Desktop Tarball:** \`camcraft-desktop-fedora-x86_64.tar.gz\` (\`camcraft-gui\`, \`camcraft-cli\`, \`setup-fedora-dev.sh\`, \`70-camcraft-aoa.rules\`)"
            echo "- **Generic Linux Tarball:** \`camcraft-desktop-linux-x86_64.tar.gz\` (\`camcraft-gui\`, \`camcraft-cli\`, \`70-camcraft-aoa.rules\`)"
            echo "- **Checksums:** \`SHA256SUMS.txt\` (verified automatically by the in-app updater)"
            if [ "$SIGNING_MODE" = "debug-fallback" ]; then
              echo ""
              echo "> **Note:** This APK was built with the fallback debug signing key because repository release keystore secrets were not configured."
            fi
            echo ""
            echo "### SHA-256 Checksums"
            echo "\`\`\`text"
            cat release-assets/SHA256SUMS.txt
            echo "\`\`\`"
          } >> "$NOTES_FILE"

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if [ "$DRAFT" = "true" ]; then
            EXTRA_FLAGS+=(--draft)
          fi

          shopt -s nullglob
          UPLOAD_ASSETS=(
            release-assets/CamCraft-*.AppImage
            release-assets/camcraft-*.rpm
            release-assets/camcraft_*.deb
            release-assets/camcraft-desktop-fedora-x86_64.tar.gz
            release-assets/camcraft-desktop-linux-x86_64.tar.gz
            release-assets/camcraft-android-*.apk
            release-assets/SHA256SUMS.txt
          )
          if [ "${#UPLOAD_ASSETS[@]}" -ne 7 ]; then
            echo "::error::Expected 7 release assets, found ${#UPLOAD_ASSETS[@]}: ${UPLOAD_ASSETS[*]}"
            ls -la release-assets
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${UPLOAD_ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "CamCraft ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${UPLOAD_ASSETS[@]}" \
              --title "CamCraft ${TAG}" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA_FLAGS[@]}"
          fi
