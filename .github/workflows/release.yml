name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build and publish (e.g. v0.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata & Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SemVer & prepare tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected SemVer format like v0.0.1 or v0.1.0-rc.1"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          PRE="${BASH_REMATCH[4]}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}${PRE}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          IS_PRE="false"
          if [ -n "$PRE" ] || [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRE="true"
          fi

          IS_DRAFT="false"
          if [ "$INPUT_DRAFT" = "true" ]; then
            IS_DRAFT="true"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "refs/tags/${TAG}"
            fi
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "prerelease=${IS_PRE}"
            echo "draft=${IS_DRAFT}"
          } >> "$GITHUB_OUTPUT"

  build-desktop-fedora:
    name: Build Desktop (Fedora x86_64)
    runs-on: ubuntu-latest
    needs: prepare
    container: fedora:latest
    steps:
      - name: Install Fedora system dependencies & git
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            tar \
            gzip \
            findutils \
            curl \
            ca-certificates \
            gcc \
            gcc-c++ \
            clang \
            llvm-devel \
            pkgconf-pkg-config \
            ffmpeg-free-devel \
            alsa-lib-devel \
            pulseaudio-libs-devel \
            glib2-devel \
            gtk3-devel \
            libxcb-devel \
            libxkbcommon-devel \
            libxkbcommon-x11-devel \
            wayland-devel
          dnf clean all

      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release binaries
        working-directory: desktop
        run: cargo build --release --locked -p camcraft-gui -p camcraft-cli

      - name: Package Fedora desktop archive
        run: |
          PKG_DIR="dist/camcraft-desktop-fedora-x86_64"
          mkdir -p "$PKG_DIR"
          cp desktop/target/release/camcraft-gui "$PKG_DIR/"
          cp desktop/target/release/camcraft-cli "$PKG_DIR/"
          cp scripts/setup-fedora-dev.sh "$PKG_DIR/"
          cp assets/branding/linux/org.artcraft.camcraft.desktop "$PKG_DIR/"
          cp assets/branding/svg/camcraft-symbol-app-icon.svg "$PKG_DIR/org.artcraft.camcraft.svg"
          cp assets/branding/png/camcraft-app-icon-256.png "$PKG_DIR/org.artcraft.camcraft.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"
          chmod +x "$PKG_DIR/camcraft-gui" "$PKG_DIR/camcraft-cli" "$PKG_DIR/setup-fedora-dev.sh"
          tar -C dist -czf "dist/camcraft-desktop-fedora-x86_64.tar.gz" "camcraft-desktop-fedora-x86_64"

      - name: Upload Fedora desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fedora
          path: dist/camcraft-desktop-fedora-x86_64.tar.gz
          if-no-files-found: error

  build-desktop-linux:
    name: Build Desktop (Generic Linux x86_64)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux multimedia and desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            clang \
            libclang-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libasound2-dev \
            libpulse-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Build release binaries
        working-directory: desktop
        run: cargo build --release --locked -p camcraft-gui -p camcraft-cli

      - name: Package generic Linux desktop archive
        run: |
          PKG_DIR="dist/camcraft-desktop-linux-x86_64"
          mkdir -p "$PKG_DIR"
          cp desktop/target/release/camcraft-gui "$PKG_DIR/"
          cp desktop/target/release/camcraft-cli "$PKG_DIR/"
          cp assets/branding/linux/org.artcraft.camcraft.desktop "$PKG_DIR/"
          cp assets/branding/svg/camcraft-symbol-app-icon.svg "$PKG_DIR/org.artcraft.camcraft.svg"
          cp assets/branding/png/camcraft-app-icon-256.png "$PKG_DIR/org.artcraft.camcraft.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"
          chmod +x "$PKG_DIR/camcraft-gui" "$PKG_DIR/camcraft-cli"
          tar -C dist -czf "dist/camcraft-desktop-linux-x86_64.tar.gz" "camcraft-desktop-linux-x86_64"

      - name: Upload generic Linux desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/camcraft-desktop-linux-x86_64.tar.gz
          if-no-files-found: error

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      signing_mode: ${{ steps.signing.outputs.signing_mode }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Configure Android signing credentials
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "signing_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing_mode=debug-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PcamcraftVersionName=${{ needs.prepare.outputs.version }}
          -PcamcraftVersionCode=${{ needs.prepare.outputs.version_code }}
          -PcamcraftGithubRepo=${{ github.repository }}

      - name: Stage versioned APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/camcraft-android-${{ needs.prepare.outputs.tag }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/camcraft-android-*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-desktop-fedora, build-desktop-linux, build-android]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd release-assets
          sha256sum \
            "camcraft-desktop-fedora-x86_64.tar.gz" \
            "camcraft-desktop-linux-x86_64.tar.gz" \
            "camcraft-android-${TAG}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          SIGNING_MODE: ${{ needs.build-android.outputs.signing_mode }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 - "$VERSION" "$NOTES_FILE" <<'PY'
          import pathlib, re, sys

          version, out_path = sys.argv[1], sys.argv[2]
          changelog = pathlib.Path("CHANGELOG.md")
          extracted = ""
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
              if m:
                  extracted = m.group(1).strip()

          pathlib.Path(out_path).write_text(extracted, encoding="utf-8")
          PY

          if [ -s "$NOTES_FILE" ]; then
            {
              echo ""
              echo "### Assets & Checksums"
              echo "- **Fedora Desktop:** \`camcraft-desktop-fedora-x86_64.tar.gz\` (\`camcraft-gui\`, \`camcraft-cli\`, \`setup-fedora-dev.sh\`)"
              echo "- **Generic Linux Desktop:** \`camcraft-desktop-linux-x86_64.tar.gz\` (\`camcraft-gui\`, \`camcraft-cli\`)"
              echo "- **Android APK:** \`camcraft-android-${TAG}.apk\`"
              if [ "$SIGNING_MODE" = "debug-fallback" ]; then
                echo ""
                echo "> **Note:** This APK was built with the fallback debug signing key because repository release keystore secrets were not configured."
              fi
              echo ""
              echo "\`\`\`text"
              cat release-assets/SHA256SUMS.txt
              echo "\`\`\`"
            } >> "$NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if [ "$DRAFT" = "true" ]; then
            EXTRA_FLAGS+=(--draft)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "CamCraft ${TAG}" "${NOTES_ARGS[@]}"
            fi
          else
            gh release create "$TAG" release-assets/* \
              --title "CamCraft ${TAG}" \
              "${NOTES_ARGS[@]}" \
              "${EXTRA_FLAGS[@]}"
          fi
