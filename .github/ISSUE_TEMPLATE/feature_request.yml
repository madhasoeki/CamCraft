name: Feature Request
description: Propose a new capability or enhancement for CamCraft
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem / Use Case
      description: What problem does this solve or what workflow does it enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working across Desktop and/or Android.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you considered.
