[workspace]
resolver = "3"
members = [
    "crates/camcraft-protocol",
    "crates/camcraft-core",
    "crates/camcraft-cli",
    "crates/camcraft-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ArtCraft"]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
ffmpeg-next = "9.1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
v4l = "0.14.0"
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
