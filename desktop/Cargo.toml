[workspace]
resolver = "3"
members = [
    "crates/camcraft-protocol",
    "crates/camcraft-core",
    "crates/camcraft-cli",
    "crates/camcraft-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ArtCraft"]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = "0.36"
egui = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
