[workspace]
resolver = "3"
members = [
    "crates/camcraft-protocol",
    "crates/camcraft-core",
    "crates/camcraft-cli",
    "crates/camcraft-gui",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ArtCraft"]
repository = "https://github.com/madhasoeki/CamCraft"
homepage = "https://github.com/madhasoeki/CamCraft"
readme = "../README.md"
keywords = ["webcam", "v4l2", "pipewire", "android", "streaming"]
categories = ["multimedia::video", "multimedia::audio"]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }
flate2 = "1.1"
libc = "0.2"
self-replace = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.5"
v4l = "0.14.0"
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
